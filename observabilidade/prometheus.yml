global:
  scrape_interval: 15s
  scrape_timeout: 5s

storage:
  tsdb:
    retention:
      time: 7d

scrape_configs:
  - job_name: llama-server
    static_configs:
      - targets: ["llama-server:8080"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: hardware
    static_configs:
      - targets: ["hardware-exporter:9100"]
